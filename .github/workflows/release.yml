name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        run: |
          sudo apt-get update
          # Note: libayatana-appindicator3-dev conflicts with libappindicator3-dev
          # on Ubuntu 24.04, so only the ayatana variant is installed.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build bundles
        run: npx tauri build --bundles deb,appimage

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp -v src-tauri/target/release/bundle/deb/*.deb artifacts/ || true
          cp -v src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: aqua-danmaku-linux
          path: artifacts/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*

  windows:
    name: Windows (exe + msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build bundles
        run: npx tauri build --bundles nsis,msi

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe artifacts/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: aqua-danmaku-windows
          path: artifacts/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
